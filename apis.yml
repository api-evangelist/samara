name: Samara
description: >-
  Samara is a residential design and construction company that builds prefabricated,
  factory-made homes. Founded as an independent venture by Airbnb co-founder Joe Gebbia,
  Samara designs and delivers backyard accessory dwelling units (ADUs) in configurable
  Studio, One Bedroom, Two Bedroom, XL 8 and XL 10 models, alongside "Locale by Samara"
  single-family homes and a modular "kit of parts" for higher-yield multifamily infill.
  The company pairs a consumer-facing online configurator, property-eligibility checks,
  financing options and regional showrooms with factory production and installation.
  Backed by General Catalyst, Samara operates in the housing, construction technology and
  real-estate space. It is a physical-product company with no public developer API,
  documentation, or developer portal at this time.
